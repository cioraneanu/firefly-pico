version: '3.3'
services:

  firefly-pico:
    image: cioraneanu/firefly-pico:latest
    container_name: firefly_pico
    ports:
      - "6976:80"
    environment:
      - FIREFLY_URL=https://firefly.domain.com
      # Optional: on hosts that don't let non-root processes bind port 80 (e.g. Synology
      # Container Manager), change the mapping above to "6976:8080" and uncomment this:
      # - NGINX_PORT=8080
      # Optional: encrypts the API keys users save for the assistant: exactly 32 characters, or "base64:" + the output of `openssl rand -base64 32`.
      # Without it one is generated on the first start and kept in ./firefly-pico-data, so it survives upgrades.
      # - APP_KEY=<add unique 32-char key>
      - DB_CONNECTION=pgsql
      - DB_HOST=firefly-pico-postgresql
      - DB_PORT=5432
      - DB_DATABASE=firefly-pico
      - DB_USERNAME=firefly-pico
      - DB_PASSWORD=very-secure-pwd
      - TZ=Europe/London
      # Optional: AI assistant "Ramble" (any OpenAI compatible API)
      # - ASSISTANT_LLM_ENDPOINT=https://api.openai.com/v1/chat/completions
      # - ASSISTANT_LLM_MODEL=gpt-4o-mini
      # - ASSISTANT_LLM_API_KEY=your-api-key
      # - ASSISTANT_LLM_CONTEXT=
      # Optional: voice transcription for audio rambles
      # - ASSISTANT_TRANSCRIPTION_ENDPOINT=https://api.openai.com/v1/audio/transcriptions
      # - ASSISTANT_TRANSCRIPTION_MODEL=gpt-4o-mini-transcribe
      # - ASSISTANT_TRANSCRIPTION_API_KEY=your-api-key
      # - ASSISTANT_TRANSCRIPTION_LANGUAGE=en
      # - ASSISTANT_ALLOW_PRIVATE_ENDPOINTS=true  # let users point their own assistant connection at LAN hosts (e.g. Ollama)
    volumes:
      # Keeps the generated APP_KEY across upgrades (see APP_KEY above)
      - ./firefly-pico-data:/var/www/html/database/data
      # Optional: custom icons. Put .svg/.png/.webp/.jpg files in this folder and they show up in the icon picker
      # - /<your_path>/firefly-pico-icons:/var/www/html/storage/app/custom-icons:ro
    depends_on:
      - firefly-pico-postgresql
    networks:
      - firefly

  firefly-pico-postgresql:
    image: postgres:18
    container_name: firefly_pico_db
    environment:
      - POSTGRES_DB=firefly-pico
      - POSTGRES_USER=firefly-pico
      - POSTGRES_PASSWORD=very-secure-pwd
    volumes:
      - /<your_path>:/var/lib/postgresql
    networks:
      - firefly

networks:
  firefly:
