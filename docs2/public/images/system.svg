<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="title desc">
  <title id="title">Where Pico's data lives</title>
  <desc id="desc">The browser app sends requests to the Pico API. The API connects to Firefly III for financial records and to the Pico database for extra fields, templates, and profiles.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
  <rect width="860" height="350" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M248 174H314"/><path d="M534 153H568V95H602"/><path d="M534 197H568V263H602"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="38" fill="#475569" font-size="13" font-weight="700">ONE INTERFACE · TWO SOURCES OF PERSISTED DATA</text>
    <rect x="28" y="115" width="220" height="125" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="48" y="149" fill="#0c4a6e" font-size="19" font-weight="700">Browser app</text>
    <text x="48" y="178" fill="#0c4a6e" font-size="14">Screens and forms</text>
    <text x="48" y="203" fill="#0c4a6e" font-size="14">Shared state and cache</text>
    <rect x="314" y="115" width="220" height="125" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="334" y="149" fill="#312e81" font-size="19" font-weight="700">Pico API</text>
    <text x="334" y="178" fill="#312e81" font-size="14">Forwards requests</text>
    <text x="334" y="203" fill="#312e81" font-size="14">Combines record data</text>
    <rect x="602" y="55" width="230" height="100" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="622" y="90" fill="#14532d" font-size="19" font-weight="700">Firefly III</text>
    <text x="622" y="121" fill="#14532d" font-size="14">Financial records</text>
    <rect x="602" y="213" width="230" height="100" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="622" y="248" fill="#78350f" font-size="19" font-weight="700">Pico database</text>
    <text x="622" y="277" fill="#78350f" font-size="13">Extra fields, templates, profiles</text>
    <text x="28" y="319" fill="#475569" font-size="13">Read responses return through the API to the browser.</text>
  </g>
</svg>
